<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8AFF"/>
      <stop offset="100%" stop-color="#3DDBC4"/>
    </linearGradient>
  </defs>
  <!-- Hexagon frame -->
  <polygon points="16,2.5 28.5,9.7 28.5,22.3 16,29.5 3.5,22.3 3.5,9.7" fill="none" stroke="url(#ag)" stroke-width="1.2" opacity="0.5"/>
  <!-- Left AI node -->
  <circle cx="10" cy="16" r="3.2" fill="none" stroke="url(#ag)" stroke-width="1"/>
  <circle cx="10" cy="16" r="1.3" fill="url(#ag)"/>
  <!-- Right AI node -->
  <circle cx="22" cy="16" r="3.2" fill="none" stroke="url(#ag)" stroke-width="1"/>
  <circle cx="22" cy="16" r="1.3" fill="url(#ag)"/>
  <!-- Center clash X -->
  <line x1="14.2" y1="13.8" x2="17.8" y2="18.2" stroke="url(#ag)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14.2" y1="18.2" x2="17.8" y2="13.8" stroke="url(#ag)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
