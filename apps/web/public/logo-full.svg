<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8AFF"/>
      <stop offset="100%" stop-color="#3DDBC4"/>
    </linearGradient>
  </defs>

  <!-- Hexagon frame -->
  <polygon points="40,6 68,22 68,58 40,74 12,58 12,22" fill="none" stroke="#E8E8F0" stroke-width="1.5" opacity="0.4"/>

  <!-- Left AI node -->
  <circle cx="28" cy="40" r="8" fill="none" stroke="#E8E8F0" stroke-width="1.2"/>
  <circle cx="28" cy="40" r="3.5" fill="#E8E8F0"/>

  <!-- Right AI node -->
  <circle cx="52" cy="40" r="8" fill="none" stroke="#E8E8F0" stroke-width="1.2"/>
  <circle cx="52" cy="40" r="3.5" fill="#E8E8F0"/>

  <!-- Center clash X -->
  <line x1="37" y1="35.5" x2="43" y2="44.5" stroke="url(#ag)" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="44.5" x2="43" y2="35.5" stroke="url(#ag)" stroke-width="2" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text
    x="92" y="52"
    font-family="'Space Grotesk', system-ui, sans-serif"
    font-weight="700"
    font-size="42"
    letter-spacing="4"
    fill="#E8E8F0"
  >BOUT</text>
</svg>
