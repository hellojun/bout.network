<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B8AFF"/>
      <stop offset="100%" stop-color="#3DDBC4"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="600" height="600" fill="#0A0A0F"/>

  <g transform="translate(44,44)">
    <!-- Outer hexagon ring -->
    <polygon
      points="256,52 432,154 432,358 256,460 80,358 80,154"
      fill="none"
      stroke="#E8E8F0"
      stroke-width="4"
      opacity="0.15"
    />

    <!-- Main hexagon -->
    <polygon
      points="256,78 412,168 412,344 256,434 100,344 100,168"
      fill="none"
      stroke="#E8E8F0"
      stroke-width="2.5"
      opacity="0.35"
    />

    <!-- Left AI agent node -->
    <circle cx="172" cy="256" r="38" fill="none" stroke="#E8E8F0" stroke-width="2.5"/>
    <circle cx="172" cy="256" r="16" fill="#E8E8F0"/>
    <line x1="134" y1="256" x2="108" y2="256" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <line x1="172" y1="218" x2="172" y2="192" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <line x1="172" y1="294" x2="172" y2="320" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <circle cx="108" cy="256" r="3" fill="#E8E8F0" opacity="0.5"/>
    <circle cx="172" cy="192" r="3" fill="#E8E8F0" opacity="0.5"/>
    <circle cx="172" cy="320" r="3" fill="#E8E8F0" opacity="0.5"/>

    <!-- Right AI agent node -->
    <circle cx="340" cy="256" r="38" fill="none" stroke="#E8E8F0" stroke-width="2.5"/>
    <circle cx="340" cy="256" r="16" fill="#E8E8F0"/>
    <line x1="378" y1="256" x2="404" y2="256" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <line x1="340" y1="218" x2="340" y2="192" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <line x1="340" y1="294" x2="340" y2="320" stroke="#E8E8F0" stroke-width="2" opacity="0.5"/>
    <circle cx="404" cy="256" r="3" fill="#E8E8F0" opacity="0.5"/>
    <circle cx="340" cy="192" r="3" fill="#E8E8F0" opacity="0.5"/>
    <circle cx="340" cy="320" r="3" fill="#E8E8F0" opacity="0.5"/>

    <!-- Center clash — crossing blades -->
    <line x1="228" y1="228" x2="284" y2="284" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="228" y1="284" x2="284" y2="228" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Center diamond -->
    <polygon points="256,238 268,256 256,274 244,256" fill="url(#accentGrad)"/>

    <!-- Connection dashes -->
    <line x1="210" y1="256" x2="238" y2="256" stroke="#E8E8F0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
    <line x1="274" y1="256" x2="302" y2="256" stroke="#E8E8F0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

    <!-- Top pixel decoration -->
    <rect x="251" y="100" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.3"/>
    <rect x="241" y="110" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.2"/>
    <rect x="261" y="110" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.2"/>

    <!-- Bottom pixel decoration -->
    <rect x="251" y="400" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.3"/>
    <rect x="241" y="390" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.2"/>
    <rect x="261" y="390" width="10" height="10" rx="1" fill="#E8E8F0" opacity="0.2"/>
  </g>
</svg>
